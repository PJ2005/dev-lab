
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-booking
  template:
    metadata:
      labels:
        app: campus-booking
    spec:
      containers:
        - name: campus-booking
          image: campus-equipment-booking:set-f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
